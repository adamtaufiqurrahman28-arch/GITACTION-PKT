
name: Seraphim Secure Pipeline - Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-push:
    name: Docker Build and Harbor Push

    runs-on:
      - self-hosted
      - Linux
      - X64
      - adm-gitaction
      - pkt

    timeout-minutes: 20

    steps:
      # STEP 1 - Checkout repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # STEP 2 - Verify Docker environment
      - name: Verify Docker and Buildx
        run: |
          docker --version
          docker buildx version
          docker info --format 'Storage: {{.Driver}}'

      # STEP 3 - Authenticate and push image
      - name: Build and Push Image to Harbor
        shell: bash
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail

          # Temporary Docker credentials
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          # Image configuration
          IMAGE="${HARBOR_REGISTRY}/seraphim-secure-pipeline/nginx-lab"
          TAG="sha-${GITHUB_SHA::12}"

          echo "================================="
          echo "SERAPHIM SECURE PIPELINE"
          echo "================================="

          # Authenticate to Harbor
          echo "Authenticating to Harbor..."

          printf '%s' "$HARBOR_PASSWORD" | \
            docker login "$HARBOR_REGISTRY" \
            --username "$HARBOR_USERNAME" \
            --password-stdin

          # Buildx verification
          echo "Checking Buildx builder..."
          docker buildx inspect --bootstrap

          # Build and push directly
          echo "Building and pushing image..."

          docker buildx build \
            --platform linux/amd64 \
            --progress=plain \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${TAG}" \
            --push \
            .

          echo "================================="
          echo "DOCKER BUILD AND PUSH SUCCESSFUL"
          echo "================================="

          docker logout "$HARBOR_REGISTRY"

      # STEP 4 - Pipeline summary
      - name: Pipeline Summary
        if: success()
        run: |
          echo "### Seraphim Secure Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker Build: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          echo "Harbor Push: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
